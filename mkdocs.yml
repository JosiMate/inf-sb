site_name: Informatyka 1W
site_description: Materiały do informatyki — klasa 1W, branżowa szkoła I stopnia, PCEiKZ Szczucin
site_author: PCEiKZ Szczucin

# Adres docelowy strony. Przy GitHub Pages dla repozytorium projektowego
# ma postać https://<użytkownik>.github.io/<nazwa-repo>/ — zmień, jeśli
# nazwiesz repozytorium inaczej albo podepniesz własną domenę.
site_url: https://josimate.github.io/inf-sb/

# Włącza w nagłówku odnośnik do repozytorium i przycisk "Edytuj tę stronę".
repo_url: https://github.com/JosiMate/inf-sb
repo_name: JosiMate/inf-sb
edit_uri: edit/main/docs/
copyright: PCEiKZ Szczucin — materiały do użytku edukacyjnego

theme:
  name: material
  language: pl
  icon:
    logo: material/monitor-edit
    repo: fontawesome/brands/github
  favicon: assets/favicon.png
  palette:
    # Dwa stany: ciemny (domyślny) i jasny. Wpisu „zgodny z systemem" tu nie ma
    # celowo — Material rozpoznaje ustawienie systemu tylko wtedy, gdy pozostałe
    # wpisy mają media „(prefers-color-scheme: light)" i „(prefers-color-scheme:
    # dark)". Wtedy jednak to system decyduje o motywie startowym i nie da się
    # jednocześnie wymusić ciemnego jako domyślnego. Wybrany został ciemny
    # domyślny, więc przełącznik ma dwa położenia i nie może się zablokować.
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb jasny
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb ciemny
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

extra_css:
  # Kolejność ma znaczenie: najpierw style elementów interaktywnych,
  # potem warstwa wyglądu powłoki dokumentacji, na końcu kolory serwisu.
  - assets/extra.css
  - stylesheets/extra.css
  - stylesheets/motyw.css

extra_javascript:
  # docx.umd.js celowo NIE jest tu wymieniony — karta.js doczyta go dopiero
  # przy generowaniu pliku, żeby nie obciążać czytelników materiału.
  - assets/js/karta.js
  # karty.js korzysta z window.KartaPracy, więc musi iść PO karta.js
  - assets/js/karty.js
  - assets/js/quiz.js
  - assets/js/postep.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Odnośnik do tej sekcji
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # Ikony Material/Octicons zapisywane jako :material-nazwa: — bez tego
  # rozszerzenia shortcode'y zostają w tekście jako goły napis.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  # Wyszukiwarka lunr nie ma polskiego stemmera (biblioteka lunr-languages
  # nie wspiera polskiego), więc świadomie zostawiamy tokenizer domyślny.
  - search

validation:
  links:
    # Strony tematów odsyłają do konkretnych zadań w karcie pracy
    # (karta.md#zadanie-3). Te kotwice powstają dopiero w przeglądarce, gdy
    # karta.js zbuduje kartę z pliku JSON, więc MkDocs ich w źródle nie widzi
    # i przy każdym temacie zgłaszałby INFO o „braku kotwicy". Wyłączamy
    # sprawdzanie SAMYCH KOTWIC — sprawdzanie istnienia plików, które już raz
    # wyłapało realny błąd w odsyłaczach, zostaje włączone.
    anchors: ignore

# ↓↓↓ nawigacja generowana przez narzedzia/genstrony_sb.py
nav:
  - Start: index.md
  - "Dział I. Przestrzeganie prawa i zasad bezpieczeństwa podczas pracy przy komputerze":
      - Przegląd działu: dzial-1/index.md
      - "Wymagania edukacyjne i bhp": dzial-1/wymagania-i-bhp.md
      - "Wizerunek w sieci": dzial-1/kim-jestem.md
      - Karta pracy: dzial-1/karta.md
  - "Dział II. Programowanie i algorytmy":
      - Przegląd działu: dzial-2/index.md
      - Karta pracy: dzial-2/karta.md
  - "Dział III. Aplikacje komputerowe pomagają w pracy":
      - Przegląd działu: dzial-3/index.md
      - Karta pracy: dzial-3/karta.md
  - "Dział IV. Peryferia pomagają w pracy zawodowej":
      - Przegląd działu: dzial-4/index.md
      - Karta pracy: dzial-4/karta.md
  - "Dział V. Wykorzystanie sieci w pracy zawodowej":
      - Przegląd działu: dzial-5/index.md
      - Karta pracy: dzial-5/karta.md
  - Karty pracy: karty/index.md
# ↑↑↑ koniec bloku generowanego

extra:
  social:
    - icon: material/school
      link: https://www.pceikz.pl
      name: PCEiKZ Szczucin
  generator: false

not_in_nav: |
  /assets/
